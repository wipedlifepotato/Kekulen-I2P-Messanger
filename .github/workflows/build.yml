name: Build Kekulen (SAM branch)

on:
  push:
    branches: [ "SAM" ]
  pull_request:
    branches: [ "SAM" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: kekulen-linux
            binary_name: kekulen
          - os: windows-latest
            artifact_name: kekulen-windows
            binary_name: kekulen.exe
          - os: macos-latest
            artifact_name: kekulen-macos
            binary_name: kekulen

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build Release
      run: cargo build --release

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: target/release/${{ matrix.binary_name }}
