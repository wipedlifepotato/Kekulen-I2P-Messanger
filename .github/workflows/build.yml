name: Build Kekulen (SAM branch)

on:
  push:
    branches: [ "SAM" ]
  pull_request:
    branches: [ "SAM" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: kekulen-ios
            target: aarch64-apple-ios
            binary_name: kekulen
            is_ios: true
          - os: ubuntu-latest
            artifact_name: kekulen-linux
            binary_name: kekulen
            is_android: false
          - os: windows-latest
            artifact_name: kekulen-windows
            binary_name: kekulen.exe
            is_android: false
          - os: macos-latest
            artifact_name: kekulen-macos
            binary_name: kekulen
            is_android: false
          - os: ubuntu-latest
            artifact_name: kekulen-android
            target: aarch64-linux-android
            binary_name: kekulen
            is_android: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Android
        if: matrix.is_android == true
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | head -1)
          echo "Using NDK at: $ANDROID_NDK_HOME"
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk
          cargo ndk -t ${{ matrix.target }} build --release
      - name: Build iOS
        if: matrix.is_ios == true
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
      - name: Build Release (PC)
        if: matrix.is_android == false && matrix.is_ios == false
        run: cargo build --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary_name }}
            target/release/${{ matrix.binary_name }}
          if-no-files-found: error
